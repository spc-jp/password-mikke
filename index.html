<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#087b75"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>パスワードみっけ｜操作体験デモ</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#173047;background:#f3f7f9;font-size:17px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0c83be;outline-offset:3px}a{color:#12648b}.wrap{width:min(100%,540px);margin:auto;min-height:100dvh;background:#fff;box-shadow:0 5px 32px #12263a12;padding:0 18px 95px}header{margin:0 -18px;padding:18px 19px 16px;background:#e6f3f3;border-bottom:1px solid #d1e5e3}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:#087b75;color:white;font-size:24px}.brand strong{font-size:21px;display:block}.brand small{display:block;margin-top:2px;color:#41635f;font-size:12px}.demo{margin-top:12px;background:#fff4d8;border:1px solid #e2c578;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.65;color:#654900}.main{padding-top:21px}h1{font-size:23px;line-height:1.45;margin:0 0 8px}h2{font-size:19px;margin:0 0 10px}p{line-height:1.75;margin:5px 0 14px}.muted{color:#5a6f7d;font-size:14px}.tile{border:2px solid #dbe8ed;background:#fff;border-radius:16px;padding:17px;text-align:left;width:100%;display:flex;align-items:center;gap:14px;margin:12px 0;color:inherit}.tile .ico{background:#e8f5f4;border-radius:12px;width:50px;height:50px;display:grid;place-items:center;font-size:25px;flex:none}.tile strong{font-size:18px;display:block}.tile small{color:#5a6f7d;font-size:13px;display:block;margin-top:5px;line-height:1.5}.card{border:1px solid #dbe8ed;background:#fff;border-radius:16px;padding:17px;margin:14px 0}.soft{background:#f3f8fa;border-radius:14px;padding:15px;margin:12px 0}.btn{border:0;border-radius:12px;min-height:52px;padding:12px 17px;font-size:17px;font-weight:700;background:#087b75;color:white;width:100%;margin:7px 0}.btn.secondary{background:white;color:#116f6b;border:2px solid #82c2bb}.btn.ghost{background:#edf3f6;color:#294c5e}.btn:disabled{opacity:.5;cursor:not-allowed}.back{border:0;background:none;color:#166f7f;padding:10px 0;font-weight:700}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:8px}input,select{width:100%;border:2px solid #c8d9df;border-radius:10px;min-height:50px;padding:10px 12px;background:white;color:#173047}input[type=checkbox]{width:22px;height:22px;min-height:auto;accent-color:#087b75}.search{margin:13px 0 19px}.item{border:1px solid #d7e5e9;border-radius:12px;padding:15px;display:flex;align-items:center;gap:12px;width:100%;background:white;text-align:left;margin:9px 0}.item .grow{flex:1}.item strong{display:block;font-size:17px}.item small{display:block;color:#617582;margin-top:4px}.badge{display:inline-block;border-radius:999px;font-size:12px;padding:4px 9px;font-weight:700;background:#e8f2f2;color:#286763}.badge.orange{background:#fff0cd;color:#8a5700}.status{font-size:15px;color:#4d6572;margin-bottom:10px}.secret{padding:14px;border:2px dashed #b5cbd1;border-radius:10px;background:#f5f9fa;overflow-wrap:anywhere;line-height:1.7;font-weight:700;letter-spacing:.4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.two .btn{font-size:15px;padding:10px}.steps{display:flex;gap:5px;margin:16px 0}.steps span{height:7px;flex:1;border-radius:10px;background:#dce5e8}.steps span.active{background:#087b75}.tip{border-left:4px solid #087b75;padding:11px 14px;background:#eef8f5;font-size:14px;line-height:1.7;margin:13px 0}.warn{border-left:4px solid #d18e29;background:#fff8e9;padding:12px 14px;font-size:14px;line-height:1.7;margin:15px 0}.checks{display:flex;gap:10px;align-items:center;line-height:1.5;margin:15px 0}.tiny{font-size:12px;color:#657985;line-height:1.6}.footnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);display:flex;border-top:1px solid #dae4e8;background:#ffffffee;backdrop-filter:blur(10px);padding:8px 10px max(8px,env(safe-area-inset-bottom))}.footnav button{flex:1;border:0;background:transparent;color:#4f6774;min-height:56px;font-size:12px;font-weight:700}.footnav button .ni{display:block;font-size:23px;margin-bottom:2px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.empty{text-align:center;padding:24px 4px;color:#617582}@media(min-width:650px){.wrap{border-radius:20px;margin:25px auto;min-height:calc(100dvh - 50px);overflow:hidden}.footnav{bottom:10px;border:1px solid #dae4e8;border-radius:15px;width:520px}}@media(prefers-reduced-motion:no-preference){button{transition:background .16s,transform .12s}button:active{transform:scale(.99)}}
.pw-block{border:1px solid #d7e5e9;border-radius:15px;padding:15px;margin:12px 0}.pw-block h2{margin:0 0 10px}.pw-block.current{background:#f3f8fa}.pw-block.next{border:2px solid #87c3be;background:#f6fbfa}.pw-block.old{background:#fafbfc}.flow-no{display:inline-grid;place-items:center;background:#087b75;color:white;border-radius:50%;height:27px;width:27px;font-size:14px;margin-right:7px}.secret{min-height:52px}.mini-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.smallbtn{border:1px solid #b9d1d4;background:white;color:#166b6b;border-radius:10px;padding:9px 12px;min-height:44px;font-weight:700}.history-row{border-top:1px solid #e2ebed;padding:11px 0}.history-row:first-child{border-top:0}.history-row .secret{font-size:14px;min-height:0;margin-top:6px}.pill-note{color:#496978;font-size:13px;line-height:1.6}.tag{background:#e7f1f0;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:700} .statusok{background:#e7f5ed;color:#14613f}.statuswarn{background:#fff0cd;color:#8a5700}
</style>
</head>
<body>
<div class="wrap"><header><div class="brand"><div class="logo" aria-hidden="true">🔐</div><div><strong>パスワードみっけ</strong><small>考えない・忘れない・迷わない</small></div></div><div class="demo"><strong>操作体験用デモ</strong>：架空のIDとPWだけを使用します。実際の個人情報やパスワードは入力しないでください。保存機能・暗号化・自動入力は未実装です。</div></header><main class="main" id="app" aria-live="polite"></main><nav class="footnav" aria-label="メインメニュー"><button data-nav="home"><span class="ni">🏠</span>ホーム</button><button data-nav="find"><span class="ni">🔎</span>探す</button><button data-nav="change"><span class="ni">🔄</span>変更</button><button data-nav="help"><span class="ni">❔</span>使い方</button></nav></div>
<script>
(()=>{'use strict';
const initial=[
{id:'g',name:'サンプルメール',type:'メール',user:'demo-mail@example.invalid',pw:'SAMPLE-CURRENT-MAIL-001',history:[],date:'未設定',icon:'✉️'},
{id:'s',name:'サンプル通販',type:'お買い物',user:'demo-shop@example.invalid',pw:'SAMPLE-CURRENT-SHOP-002',history:[{pw:'SAMPLE-OLD-SHOP-001',date:'以前のサンプル'}],date:'未設定',icon:'🛍️'},
{id:'n',name:'サンプルSNS',type:'SNS',user:'demo-sns@example.invalid',pw:'SAMPLE-CURRENT-SNS-003',history:[],date:'未設定',icon:'💬'}];
let items=structuredClone(initial),page='home',selected='s',attempt=0,search='',draftName='',draftType='その他',visible={current:false,next:false,history:false},confirmed=false,showGuide=false;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=()=>items.find(x=>x.id===selected)||items[0];
// 固定したデモ用の文字列のみ。実際のPWとして使わないでください。
const demoCandidate=()=>`DEMO-NEXT-${String(++attempt).padStart(3,'0')}-NOT-FOR-LOGIN`;
function prepare(x){if(!x.next)x.next=demoCandidate()}
function go(p){page=p;visible={current:false,next:false,history:false};confirmed=false;showGuide=false;if(p==='change')prepare(item());render();scrollTo(0,0)}
const btn=(t,a,cls='')=>`<button class="btn ${cls}" data-action="${a}">${t}</button>`;
const rows=(arr,mode)=>arr.length?arr.map(x=>`<button class="item" data-item="${esc(x.id)}" data-mode="${mode}"><span style="font-size:27px" aria-hidden="true">${x.icon}</span><span class="grow"><strong>${esc(x.name)}</strong><small>${esc(x.type)} ・ ${esc(x.user)}</small></span><span aria-hidden="true">›</span></button>`).join(''):'<div class="empty">該当するサービスがありません</div>';
function pwValue(v,show){return show?esc(v):'●●●●●●●●●●●●●●●●'}
function render(){let x=item(),html='';
if(page==='home')html=`<h1>今日は何をしますか？</h1><p class="muted">むずかしい操作は必要ありません。</p><button class="tile" data-nav="find"><span class="ico">🔎</span><span><strong>① パスワードを探す</strong><small>現在のPWを確認する</small></span></button><button class="tile" data-nav="change"><span class="ico">🔄</span><span><strong>② パスワードを変更する</strong><small>現在 → 次回候補 → 変更完了 → 履歴</small></span></button><button class="tile" data-nav="new"><span class="ico">➕</span><span><strong>③ 新しく登録する</strong><small>架空のサービスを追加して試す</small></span></button><div class="tip">💡 「② パスワードを変更する」で新しい画面を体験できます。</div>`;
if(page==='find')html=`<h1>パスワードを探す</h1><p class="muted">サービス名やIDで探せます。</p><div class="field"><label for="q">検索</label><input id="q" placeholder="例：通販、メール" value="${esc(search)}" autocomplete="off"></div><div id="results">${rows(items.filter(y=>(y.name+' '+y.type+' '+y.user).toLowerCase().includes(search.toLowerCase())),'detail')}</div>`;
if(page==='detail')html=`<button class="back" data-action="find">← 一覧へ</button><h1>${esc(x.icon)} ${esc(x.name)}</h1><div class="card"><strong>ログインID（デモ）</strong><div class="secret" style="margin-top:9px">${esc(x.user)}</div><h2 style="margin-top:18px">現在のパスワード</h2><div class="secret">${pwValue(x.pw,visible.current)}</div><div class="two">${btn(visible.current?'🙈 隠す':'👁️ 表示','toggle-current','secondary')}${btn('📋 コピー','copy-current','secondary')}</div><p class="muted">最終変更日：${esc(x.date)}</p></div>${btn('🔄 変更画面を開く','change-selected')}`;
if(page==='change'){
prepare(x);
html=`<h1>パスワードを変更する</h1><p class="muted">現在のPWと次回候補を、同じ画面で管理します。</p><div class="field"><label for="target">サービスを選ぶ</label><select id="target">${items.map(y=>`<option value="${esc(y.id)}" ${y.id===selected?'selected':''}>${esc(y.name)}</option>`).join('')}</select></div>`;
html+=`<section class="pw-block current"><h2><span class="flow-no">1</span>現在のパスワード</h2><div class="pill-note">今、登録されているPWです。</div><div class="secret">${pwValue(x.pw,visible.current)}</div><div class="two">${btn(visible.current?'🙈 隠す':'👁️ 表示','toggle-current','secondary')}${btn('📋 コピー','copy-current','secondary')}</div></section>`;
html+=`<section class="pw-block next"><div class="mini-row"><h2><span class="flow-no">2</span>次回のPW候補</h2><span class="tag statuswarn">未変更</span></div><div class="pill-note">アプリが考えた次回用の文字列です。</div><div class="secret">${pwValue(x.next,visible.next)}</div><div class="two">${btn(visible.next?'🙈 隠す':'👁️ 表示','toggle-next','secondary')}${btn('📋 コピー','copy-next','secondary')}</div>${btn('🔁 別の候補にする','regenerate','ghost')}<p class="tiny">※デモ用の文字列です。本物のサイトには使用しないでください。</p></section>`;
html+=`<section class="pw-block"><h2><span class="flow-no">3</span>変更が終わったら</h2><p class="muted">公式サイトでPWを変更してから、ここで確定します。</p>${btn(showGuide?'▲ 変更の手順を閉じる':'📖 変更の手順を見る','guide','secondary')}${showGuide?`<div class="soft"><p><strong>変更手順（イメージ）</strong></p><p>① 正しい公式サイトを開く</p><p>② アカウント設定からPW変更を選ぶ</p><p>③ 次回候補を入力し、変更を完了する</p><p>④ 変更成功を確認する</p><p class="tiny">このデモから公式サイトへの変更は行えません。</p></div>`:''}<label class="checks"><input type="checkbox" id="confirm" ${confirmed?'checked':''}><span>公式サイトで変更が完了した想定です（デモ）</span></label><button class="btn" data-action="commit" ${confirmed?'':'disabled'}>✅ 次回候補を最新PWにする</button><div class="tip">☝️ ボタンを押すまでは、現在のPWは変わりません。</div></section>`;
html+=`<section class="pw-block old"><div class="mini-row"><h2><span class="flow-no">4</span>過去のPW履歴</h2><span class="tag">最大3件</span></div><p class="pill-note">変更したPWの履歴を確認できます。安全な本番版では履歴の保存期間と削除を設定します。</p>${x.history.length?x.history.map((h,i)=>`<div class="history-row"><div class="mini-row"><strong>${i+1}回前のPW</strong><span class="tiny">${esc(h.date)}</span></div><div class="secret">${pwValue(h.pw,visible.history)}</div></div>`).join(''):'<p class="muted">まだ履歴はありません。</p>'}${x.history.length?btn(visible.history?'🙈 履歴を隠す':'👁️ 履歴を見る','toggle-history','secondary'):''}</section>`;
}
if(page==='success')html=`<div style="text-align:center;margin:20px 0"><div style="font-size:60px">✅</div><h1>最新PWに更新しました！</h1><p>「${esc(x.name)}」のデモ情報を更新しました。</p></div><div class="tip">以前のPWは履歴に移動しました。変更の仕組みを体験するためのデモです。</div>${btn('🔄 現在・次回候補・履歴を見る','change-selected')}${btn('ホームに戻る','home','ghost')}`;
if(page==='new')html=`<button class="back" data-action="home">← 戻る</button><h1>新しく登録する</h1><div class="warn">架空のサービス名だけ入力してください。本当のIDやPWは入力しないでください。</div><div class="field"><label for="newname">架空のサービス名</label><input id="newname" maxlength="40" placeholder="例：お試しサービス" value="${esc(draftName)}" autocomplete="off"></div><div class="field"><label for="newtype">カテゴリ</label><select id="newtype">${['その他','メール','お買い物','SNS','仕事'].map(t=>`<option ${t===draftType?'selected':''}>${t}</option>`).join('')}</select></div>${btn('➕ デモに追加する','add')}`;
if(page==='help')html=`<h1>使い方</h1><div class="card"><h2>4つの流れ</h2><p><strong>1. 現在のPW</strong>：今の情報を見る</p><p><strong>2. 次回候補</strong>：新しいPW候補を確認する</p><p><strong>3. 変更完了</strong>：サービス側の変更を確認してから確定する</p><p><strong>4. 過去の履歴</strong>：最大3回前まで確認する</p></div><div class="warn"><strong>安全上の注意</strong><p>これは操作確認用です。暗号化・安全なPW生成・本人認証・保存機能はありません。登録したデモ情報は画面の再読み込みで初期状態に戻ります。本物のPWを入力したり、生成されたデモ文字列を実際のサービスで使わないでください。</p></div>${btn('デモを最初に戻す','reset','secondary')}`;
app.innerHTML=html;
}
function copyDemo(v){if(navigator.clipboard&&isSecureContext){navigator.clipboard.writeText(v).then(()=>alert('デモ文字列をコピーしました。実際のサービスには使わないでください。')).catch(()=>alert('コピーできませんでした。'))}else alert('この環境ではコピーが使えません。デモ表示をご確認ください。')}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav],[data-item],[data-action]');if(!n)return;if(n.dataset.nav){if(n.dataset.nav==='find')search='';go(n.dataset.nav);return}if(n.dataset.item){selected=n.dataset.item;go(n.dataset.mode||'detail');return}let a=n.dataset.action,x=item();if(a==='home'||a==='find'){go(a);return}if(a==='change-selected'){go('change');return}if(a==='toggle-current'||a==='toggle-next'||a==='toggle-history'){let k=a.replace('toggle-','');visible[k]=!visible[k];render();return}if(a==='copy-current'){copyDemo(x.pw);return}if(a==='copy-next'){prepare(x);copyDemo(x.next);return}if(a==='regenerate'){x.next=demoCandidate();visible.next=true;confirmed=false;render();return}if(a==='guide'){showGuide=!showGuide;render();return}if(a==='commit'){if(!confirmed)return; x.history.unshift({pw:x.pw,date:x.date==='未設定'?'以前のデモPW':x.date});x.history=x.history.slice(0,3);x.pw=x.next;x.next=demoCandidate();x.date=new Date().toLocaleDateString('ja-JP');go('success');return}if(a==='add'){let name=draftName.trim();if(name.length<2){alert('架空のサービス名を2文字以上入力してください。');return}let id='demo-'+items.length;items.push({id,name,type:draftType,user:'demo-only@example.invalid',pw:'SAMPLE-CURRENT-NO-REAL-PW',history:[],date:'未設定',icon:'📁'});draftName='';selected=id;go('change');return}if(a==='reset'){items=structuredClone(initial);selected='s';attempt=0;search='';go('home');return}});
document.addEventListener('input',e=>{if(e.target.id==='q'){search=e.target.value;document.getElementById('results').innerHTML=rows(items.filter(y=>(y.name+' '+y.type+' '+y.user).toLowerCase().includes(search.toLowerCase())),'detail')}if(e.target.id==='newname')draftName=e.target.value;if(e.target.id==='confirm'){confirmed=e.target.checked;let b=document.querySelector('[data-action="commit"]');if(b)b.disabled=!confirmed}});
document.addEventListener('change',e=>{if(e.target.id==='target'){selected=e.target.value;go('change')}if(e.target.id==='newtype')draftType=e.target.value});render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // Offline setup is optional; the app remains usable online.
    });
  });
}
</script></body></html>
